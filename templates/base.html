<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirGuard Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Clash+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="page-enter">
  <div class="bgfx"></div>
  <div class="bg-grain"></div>
  <div class="bg-vignette"></div>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <div class="bg-orb orb-c"></div>
  <div id="appToast" class="toast"></div>
  <div class="layout">
    <aside class="sidebar glass">
      <h2>AirGuard Pro</h2>
      <p class="mini">{{ user }} ({{ role }})</p>
      <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/reports">Reports</a>
        <a href="/controls">Controls</a>
        <a href="/chatbot">Chatbot</a>
        <a href="/logout">Logout</a>
      </nav>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="/static/ui-animations.js?v=20260513a"></script>
</body>
</html>
